{% set name = "html-sanitizer" %}
{% set version = "2.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/html_sanitizer-{{ version }}.tar.gz
  sha256: 78fb6991a66f3a3da97d31d1ed0a6157f9d2b959deb111f83c4908f945c1ba0a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - beautifulsoup4
    - lxml >=5.2
    - lxml-html-clean >=0.4

test:
  imports:
    - html_sanitizer
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: HTML sanitizer
  home: https://github.com/matthiask/html-sanitizer/
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pkgw
