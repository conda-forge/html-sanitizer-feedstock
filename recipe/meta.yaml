{% set name = "html-sanitizer" %}
{% set version = "2.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/html_sanitizer-{{ version }}.tar.gz
  sha256: e20bbc92df161d16c04aace70b2f69f482bd1e60d40aaa8b3209a2aeb94cd524

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - beautifulsoup4
    - lxml >=5.2
    - lxml-html-clean >=0.1

test:
  imports:
    - html_sanitizer
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: HTML sanitizer
  home: https://github.com/matthiask/html-sanitizer/
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pkgw
